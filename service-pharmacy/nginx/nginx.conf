events {
    worker_connections 1024;
}

http {
    # ── Upstream: definisi alamat tiap service ─────────────────────────────
    upstream registration_service {
        server registration-service:8001;
    }

    upstream pharmacy_service {
        server pharmacy-service:5001;
    }

    upstream medical_service {
        server medical-service:5002;
    }

    upstream integration_layer {
        server integration-layer:5000;
    }

    # ── Server utama (API Gateway) ─────────────────────────────────────────
    server {
        listen 80;

        # Registrasi Service → http://localhost/api/registration/...
        location /api/registration/ {
            proxy_pass http://registration_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Farmasi Service → http://localhost/api/pharmacy/...
        location /api/pharmacy/ {
            proxy_pass http://pharmacy_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rekam Medis Service → http://localhost/api/medical/...
        location /api/medical/ {
            proxy_pass http://medical_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Integration Layer → http://localhost/integration/...
        location /integration/ {
            proxy_pass http://integration_layer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check gateway
        location /health {
            return 200 '{"status":"gateway_ok"}';
            add_header Content-Type application/json;
        }
    }
}
